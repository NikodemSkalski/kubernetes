name: Reusable bicep deploy workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      bicep-file:
        required: true
        type: string
				default: '${{ github.workspace }}/bicep/deployment.bicep'
      parameters-file-path:
        required: true
        type: string
				default: '${{ github.workspace }}/bicep/environments/dev.bicepparam'

jobs:
	bicepdeploy:
		name: 'Storage account Deploment and validation'
		runs-on: ubuntu-latest
		environment: ${{ inputs.environment }}

		defaults:
			run:
				shell: pwsh

		steps:
			- name: Checkout repo
				uses: actions/checkout@v4        

			- name: Set alias for bicep modules
				shell: pwsh
				env:
					ACR_NAME: ${{ vars.ACR_NAME }}
				run: |
						$bicepConfigPath = "${{ github.workspace }}/bicep/bicepconfig.json"
						$bicepConfig = Get-Content -Path $bicepConfigPath | ConvertFrom-Json
						$bicepConfig.moduleAliases.br.develop.registry = "$env:ACR_NAME"
						$bicepConfig | ConvertTo-Json -Depth 10 | Set-Content -Path $bicepConfigPath

			- name: Azure login
				uses: azure/login@v2
				with:
						creds: ${{ secrets.AZURE_CREDENTIALS }}
					
			- name: Login to ACR
				uses: docker/login-action@v3
				with:
					registry: ${{ vars.ACR_NAME }}
					username: ${{ secrets.ACR_ADMIN_USERNAME }}
					password: ${{ secrets.ACR_ADMIN_PASSWORD }}

			- name: Validate Bicep
				uses: Azure/bicep-deploy@v2.3.0
				with:
					type: deployment
					operation: 'validate'
					scope: 'resourceGroup'
					subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
					resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
					bicep-file: '${{ inputs.bicep-file }}'
					parameters-file: '${{ inputs.parameters-file-path }}'


      - name: Validate Bicep
        uses: Azure/bicep-deploy@v2.3.0
        with:
          type: deployment
          operation: 'validate'
          scope: 'resourceGroup'
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
					bicep-file: '${{ inputs.bicep-file }}'
          parameters-file: '${{ inputs.parameters-file-path }}'